<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="cyberShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <!-- Shield Icon -->
  <g transform="translate(10, 8)">
    <path d="M22 2 L40 9 C40 26 28 38 22 42 C16 38 4 26 4 9 Z" fill="url(#shieldFill)" stroke="url(#cyberShield)" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Radar / Search loop inside shield -->
    <circle cx="22" cy="18" r="7" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
    <line x1="27" y1="23" x2="33" y2="29" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <path d="M18 18 L21 21 L26 15" fill="none" stroke="#22c55e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Text Brand -->
  <text x="62" y="27" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#f8fafc" letter-spacing="0.5">
    PHISH<tspan fill="#38bdf8">GUARD</tspan>
  </text>
  <text x="62" y="44" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#94a3b8" letter-spacing="1.2">
    URL RISK DETECTOR
  </text>
</svg>
