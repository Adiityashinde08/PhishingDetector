<!DOCTYPE html>
<html lang="en" data-theme="cyber-cyan">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phishing URL Detector - Unit Test Suite</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="stylesheet" href="../css/variables.css">
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--color-bg-base, #0b1120);
      color: var(--color-text-main, #f8fafc);
      padding: 2rem;
      margin: 0;
      line-height: 1.5;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--color-border, #1e293b);
      padding-bottom: 1.25rem;
      margin-bottom: 1.5rem;
    }
    .title h1 {
      font-size: 1.5rem;
      margin: 0 0 0.25rem 0;
      color: var(--color-accent, #38bdf8);
    }
    .title p {
      margin: 0;
      color: #94a3b8;
      font-size: 0.9rem;
    }
    .back-btn {
      padding: 0.5rem 1rem;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid var(--color-accent, #38bdf8);
      color: var(--color-accent, #38bdf8);
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.85rem;
    }
    .test-summary-header {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }
    .metric-chip {
      background: #0f172a;
      border: 1px solid #1e293b;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
    }
    .metric-chip .label {
      font-size: 0.75rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .metric-chip .value {
      font-size: 1.35rem;
      font-weight: 700;
      color: #f8fafc;
    }
    .metric-chip.pass .value { color: #22c55e; }
    .metric-chip.fail .value { color: #ef4444; }
    .metric-chip.rate .value { color: #38bdf8; }
    .test-disclaimer-box {
      background: rgba(56, 189, 248, 0.08);
      border-left: 4px solid #38bdf8;
      padding: 0.75rem 1rem;
      border-radius: 4px;
      font-size: 0.85rem;
      color: #cbd5e1;
      margin-bottom: 1.5rem;
    }
    .test-results-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      background: #0f172a;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #1e293b;
    }
    .test-results-table th, .test-results-table td {
      padding: 0.75rem 1rem;
      text-align: left;
      border-bottom: 1px solid #1e293b;
    }
    .test-results-table th {
      background: #1e293b;
      color: #94a3b8;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.5px;
    }
    .test-badge {
      display: inline-block;
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 0.75rem;
    }
    .badge-pass { background: rgba(34, 197, 94, 0.15); color: #22c55e; border: 1px solid #22c55e; }
    .badge-fail { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid #ef4444; }
    .input-code {
      background: #1e293b;
      padding: 0.15rem 0.35rem;
      border-radius: 4px;
      color: #e2e8f0;
      font-family: Consolas, monospace;
    }
    .run-again-btn {
      padding: 0.6rem 1.2rem;
      background: #38bdf8;
      color: #0b1120;
      font-weight: 700;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }
    .run-again-btn:hover { background: #7dd3fc; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      <h1>🧪 Rule-Engine Test Suite</h1>
      <p>Automated Unit & Heuristic Verification for Phishing URL Detector (PBL Progress Review-II)</p>
    </div>
    <a href="../index.html" class="back-btn">← Back to Main Application</a>
  </div>

  <button class="run-again-btn" id="run-tests-btn">▶ Re-run Test Suite</button>

  <div id="test-output">
    <p>Executing test suite...</p>
  </div>

  <script type="module">
    import { executeAndRenderTests } from "./analyzer.test.js";

    function run() {
      executeAndRenderTests("test-output");
    }

    document.getElementById("run-tests-btn").addEventListener("click", run);
    window.addEventListener("DOMContentLoaded", run);
  </script>
</body>
</html>
